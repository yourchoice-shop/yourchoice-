name: Extract website files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          mkdir -p /tmp/yourchoice
          unzip -o yourchoice_backend_starter.zip -d /tmp/yourchoice
          cp -a /tmp/yourchoice/yourchoice_backend_starter/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib supabase .env.example next.config.ts package.json README.md tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Your Choice website source files"
            git push
          fi
